name: Update custom stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # diario 09:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm i node-fetch@3

      - name: Run stats script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_LOGIN: sofialarrain
        run: node scripts/update-stats.mjs

      - name: Commit changes
        run: |
          if [[ `git status --porcelain` ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update custom stats"
            git push
          fi
